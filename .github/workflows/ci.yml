name: CI

# SPEC-20260922-04（M7）：把「测试 + 结构守卫 + 数据隔离」变成提交前自动门禁，
# 不再依赖人工记得跑。首次运行可能需要一轮修红（见 SPEC 风险段）。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GUI 走离屏；密钥用假值（所有测试零 API 调用，仅需 bridge 构造时不报错）。
      # 注意：不要设 REZERO_DISABLE_UI_MOTION —— tests/test_motion.py 正是验证
      # 「开启态」行为，全局关闭会让 2 个用例失败（CI 首跑实测）。
      QT_QPA_PLATFORM: offscreen
      DEEPSEEK_API_KEY: test-key-not-used
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 Qt 运行库（offscreen 模式所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 结构守卫（单独列出，便于日志可读）
        run: python -m pytest tests/test_command_router.py::test_no_duplicate_method_definitions -q

      - name: 全量测试 + 数据隔离校验（跑测试前后 data/ 必须逐字节不变）
        run: |
          set -o pipefail
          bash scripts/verify_isolation.sh python -m pytest tests/ -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      # 失败取证：GitHub Actions 原始日志需登录（403），而 check-run annotations
      # 无需凭证即可读（公开仓库）——把失败文本转成 annotations，CI 才「可远程审计」。
      - name: 失败取证（annotations 公开可读，免登录定位失败用例）
        if: failure()
        continue-on-error: true
        run: |
          LOG="$RUNNER_TEMP/pytest.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::未生成 pytest 日志（步骤 7 可能未执行到 tee；见步骤自身输出）"
            exit 0
          fi
          echo "=== 失败摘要（annotations）==="
          grep -aE "^(FAILED|ERROR)|AssertionError|Error:|Fatal|fatal error|Could not load|qt\.qpa|Aborted" "$LOG" \
            | head -50 | while IFS= read -r line; do echo "::error::${line}"; done
          echo "=== 日志尾部 25 行（annotations）==="
          tail -25 "$LOG" | while IFS= read -r line; do echo "::notice::${line}"; done
          echo "=== 若为 Qt 平台崩溃，附平台相关行 ==="
          grep -anE "QT_QPA_PLATFORM|platform plugin|xcb|offscreen" "$LOG" | head -10 | while IFS= read -r line; do echo "::warning::${line}"; done

      - name: 冒烟回归（引擎纯逻辑）
        run: python tests/smoke_test.py

      - name: 失败时上传取证日志（若有）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-log
          path: data/gui.log
          if-no-files-found: ignore
