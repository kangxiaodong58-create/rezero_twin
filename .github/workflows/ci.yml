name: CI

# SPEC-20260922-04（M7）：把「测试 + 结构守卫 + 数据隔离」变成提交前自动门禁，
# 不再依赖人工记得跑。首次运行可能需要一轮修红（见 SPEC 风险段）。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 与本地测试一致的隔离口径：GUI 走离屏、引言/动效关闭、密钥用假值
      QT_QPA_PLATFORM: offscreen
      REZERO_DISABLE_VIGNETTE: "1"
      REZERO_DISABLE_UI_MOTION: "1"
      REZERO_DISABLE_HISTORY: "1"
      DEEPSEEK_API_KEY: test-key-not-used
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 Qt 运行库（offscreen 模式所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 结构守卫（单独列出，便于日志可读）
        run: python -m pytest tests/test_command_router.py::test_no_duplicate_method_definitions -q

      - name: 全量测试 + 数据隔离校验
        run: bash scripts/verify_isolation.sh python -m pytest tests/ -q

      - name: 冒烟回归（引擎纯逻辑）
        run: python tests/smoke_test.py

      - name: 失败时上传取证日志（若有）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-log
          path: data/gui.log
          if-no-files-found: ignore
